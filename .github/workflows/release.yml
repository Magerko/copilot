name: Release

# Push a tag like v0.1.0 to build the installer on a clean Windows runner and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exe=$(ls release/*.exe | head -1)
          sha=$(sha256sum "$exe" | awk '{print $1}')
          ver="${GITHUB_REF_NAME#v}"
          notes="Локальный AI-копилот для интервью и встреч (Windows). Распознавание речи на вашем ПК, ответы на вашей модели (BYOK).

          **Установка:** скачайте \`Copilot Setup ${ver}.exe\` и запустите.

          > Установщик **не подписан** сертификатом, поэтому Windows SmartScreen покажет «Неизвестный издатель».
          > Это ожидаемо для открытого проекта без платного сертификата: «Подробнее» → «Выполнить в любом случае».
          > Целостность файла можно сверить по контрольной сумме ниже.

          **Что внутри:** раздельный захват микрофона и звука собеседника, локальная ASR (whisper.cpp), оверлей без кражи фокуса и с защитой от захвата экрана, контекст из CV/JD без выдумывания фактов, офлайн-режим, история в SQLite. Приложение не обходит прокторинг и не обещает невидимости.

          **SHA-256** \`Copilot Setup ${ver}.exe\`:
          \`${sha}\`"
          files=(release/*.exe release/*.blockmap)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Copilot ${GITHUB_REF_NAME}" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Copilot ${GITHUB_REF_NAME}" --notes "$notes" "${files[@]}"
          fi
